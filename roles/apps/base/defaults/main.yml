packages_list:
  # Fonts
  - gnu-free-fonts
  - noto-fonts                    # Broad font coverage for web pages
  - noto-fonts-emoji
  - ttf-nerd-fonts-symbols-mono
  - ttf-sourcecodepro-nerd

  # Theming
  - breeze-icons                  # Fallback icons required by Papirus
  - papirus-icon-theme            # Modern SVG icon theme

  # Desktop integration
  - dunst                         # Notification daemon
  - rofi                          # Application launcher
  - rofi-calc
  - rofi-emoji
  - picom                         # X compositor that may fix tearing issues
  - numlockx                      # Turns on the numlock key in X11
  - xidlehook                     # Automatic X screen-locker/screen-saver
  - xorg-xmodmap                  # Utility for modifying keymaps and button mappings
  - xorg-server-xephyr            # Nested X server that runs as an X application
  - arandr                        # Visual front end for XRandR 1.2
  - brightnessctl                 # Backlight and LED brightness control

  # File management & portals
  - gvfs                          # Virtual filesystem: mounts, trash, recent (needed by GTK file dialogs)
  - udisks2                       # Automount of removable drives
  - ntfs-3g                       # NTFS filesystem driver and utilities
  - xdg-desktop-portal            # Portal service used by browser/app file pickers
  - xdg-desktop-portal-gtk        # GTK backend for the desktop portal
  - xdg-utils                     # xdg-open / xdg-mime: default-application handling
  - shared-mime-info              # MIME type database
  - desktop-file-utils            # Desktop entry database

  # Applications
  - betterbird-bin                # Mail Client
  - enpass-bin                    # Password Manager
  - firefox                       # Browser
  - google-chrome                 # Browser
  - joplin-desktop                # Notes Application
  - mpv                           # Media Player
  - nextcloud-client              # Nextcloud desktop client
  - signal-desktop                # Private messaging from your desktop
  - simplescreenrecorder          # Screen recorder with X11 and OpenGL support
  - visual-studio-code-bin        # Code Editor
  - wezterm                       # Terminal emulator

  # CLI tools
  - btop                          # System resource monitor
  - fzf                           # Fuzzy finder
  - ncdu                          # Disk usage analyzer with ncurses interface
  - nvm                           # Node version manager
  - pass                          # Password store (CLI)
  - tig                           # Text-mode interface for Git
  - wget                          # File downloader

  # Screenshots & clipboard
  - maim                          # Command-line screenshot utility
  - slop                          # Region/area selection (used by maim)
  - xclip                         # Clipboard access from the command line

  # Networking & security
  - gnome-keyring
  - libsecret                     # Secret Service client library
  - openssh                       # SSH protocol implementation
  - smbclient                     # Access SMB/CIFS shares
  - wireguard-tools               # VPN tool

  # Libraries
  - postgresql-libs               # Libraries for use with PostgreSQL
