- name: Install dotfiles
  block:
    - name: Clone dotfiles-repo
      git:
        repo: https://github.com/napanee/dotfiles.git
        dest: ~/.dotfiles
        version: wayland-hyprland
        recursive: true
    - name: Install dotfiles
      shell: |
        cd ~/.dotfiles
        ~/.dotfiles/dotbot/bin/dotbot -d ~/.dotfiles -c install.config.yml
  become: true
  become_user: "{{ username }}"
