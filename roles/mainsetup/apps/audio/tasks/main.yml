- import_role:
    name: mainsetup/installer
  vars:
    packages: "{{ packages_list }}"
    task_name: audio

- name: Enable PipeWire user services for all users
  # scope: global schreibt die Symlinks nach /etc/systemd/user/ und aktiviert
  # die Services für jede User-Session, ohne dass eine aktive Session nötig ist.
  # Bei scope global ist nur enable/disable möglich (kein state: started).
  systemd:
    name: "{{ item }}"
    enabled: true
    scope: global
  become: true
  loop:
    - pipewire.socket
    - pipewire-pulse.socket
    - wireplumber.service
