- name: Enable autostart
  command: arch-chroot {{ mount_path | quote }} systemctl enable {{ item | quote }}
  loop:
    - NetworkManager
    - sshd
    - systemd-resolved

- name: Create resolved drop-in directory
  file:
    path: "{{ mount_path }}/etc/systemd/resolved.conf.d/"
    state: directory

- name: Copy split-DNS config
  copy:
    src: resolved.conf.d/split-dns.conf
    dest: "{{ mount_path }}/etc/systemd/resolved.conf.d/"

- name: Create root's .ssh
  file:
    path: "{{ mount_path }}/root/.ssh/"
    state: directory

- name: Read local SSH public key
  command: ssh-add -L
  delegate_to: localhost
  changed_when: false
  register: _ssh_public_key

- name: Print public ssh key to file
  # ssh-add -L can output multiple keys; only transfer the ssh-rsa key.
  copy:
    content: "{{ _ssh_public_key.stdout_lines | select('match', 'ssh-rsa ') | join('\n') }}\n"
    dest: "{{ mount_path | quote}}/root/.ssh/authorized_keys"
