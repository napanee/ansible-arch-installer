# Starts X (and thus qtile via ~/.xinitrc) automatically on the first VT,
# independent of which login shell the user ends up with. This decouples the
# auto-start from the dotfiles' ~/.zshrc block, which only runs when the login
# shell happens to be zsh.
- name: Deploy shell-agnostic X auto-start
  become: true
  become_user: "{{ username }}"
  copy:
    dest: "{{ item.dest }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - dest: "/home/{{ username }}/.zprofile"
      content: |
        # Managed by ansible-arch-installer.
        # Auto-start the X server (which launches qtile via ~/.xinitrc) on the first VT.
        # The command -v guard prevents a logout loop if startx is not installed yet.
        if [ -z "$DISPLAY" ] && [ "$(tty)" = "/dev/tty1" ] && command -v startx >/dev/null 2>&1; then
            exec startx
        fi
    - dest: "/home/{{ username }}/.bash_profile"
      content: |
        # Managed by ansible-arch-installer.
        [ -f ~/.bashrc ] && . ~/.bashrc

        # Auto-start the X server (which launches qtile via ~/.xinitrc) on the first VT.
        # The command -v guard prevents a logout loop if startx is not installed yet.
        if [ -z "$DISPLAY" ] && [ "$(tty)" = "/dev/tty1" ] && command -v startx >/dev/null 2>&1; then
            exec startx
        fi
  loop_control:
    label: "{{ item.dest }}"
