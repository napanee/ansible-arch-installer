---
hostname_hostname: XPS13-9305
username: martin

locale_keymap: us
locale_x11_keymap: us
locale_timezone: Europe/Berlin
locale_locale: en_US.UTF-8
locale_system_lng: en_US.UTF-8

# With an SSD it is typically /dev/nvme0n1 (boot-suffix: p1, crypt-suffix: p2).
# For an HDD /dev/sda (boot-suffix: 1, crypt-suffix: 2)
install_drive: /dev/nvme0n1
boot_partition_suffix: "p1"
crypt_partition_suffix: "p2"

# Additional kernel boot parameters (e.g. "nvidia-drm.modeset=1 nvidia-drm.fbdev=1")
kernel_parameters: ""

# Additional modules to include in initramfs (e.g. nvidia nvidia_modeset nvidia_uvm nvidia_drm)
mkinitcpio_modules: []
